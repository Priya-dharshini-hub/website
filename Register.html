<html>
    <head>
        <style>
            .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #222;
    padding: 15px 40px;
}

.logo {
    color: white;
    font-size: 24px;
    font-weight: bold;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 25px;
}

.nav-links li {
    display: inline;
}

.nav-links a {
    text-decoration: none;
    color: white;
    font-size: 18px;
    transition: color 0.3s ease;
}

.nav-links a:hover {
    color: #f4b400;
}
       
            .body{background-image: url("D:\\folderp\\css\\Re.png"); background-size: 100%;}
            .h1{text-align: center; font-weight: bold;font-style: italic;}
        </style>
    </head>
    <body class="body">
        <nav class="navbar">
            <div class="logo">TravelScape</div>
    
            <ul class="nav-links">
                <li><a href="TRAVEL DESTINATION.HTML">Home</a></li>
                <li><a href="Travel Destination Showcase.html">TravelScape</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
        <h1 class="h1">
            REGISTER YOUR TRAVEL JOURNEY WITH US!
        </h1>
        <form>
            Name:<input type="text" placeholder="Enter Your Name"><br><br>
            Contact No:<input type="number" placeholder="Enter your Contact"><br><br>
            Travelling Place:<input type="text" placeholder="Enter Your Destination"><br><br>
            Boarding Date:<input type="date" placeholder="Enter YOUR Boarding Date"><br><br>
            Email:<input type="email" placeholder="Enter Email"><br><br>
            Password:<input type="password" placeholder="Enter Password"><br><br>
            Confirm Password:<input type="password" placeholder="Confirm Password"><br><br>
        </form>
        <button  type="submit" id="mybutton">Register</button>
        <script>
            let button= document.getElementById("mybutton");
            button.addEventListener("click", function() {
    alert("Congratulations For Your Travel!");
});
        </script>
    </body>
